<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="smoke" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#9ff6ff"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0b1620"/>
      <stop offset="1" stop-color="#04060a"/>
    </radialGradient>
    <path id="bat" d="M100 20 L108 6 L112 24 Q124 22 136 26 Q160 14 196 30 Q176 38 170 58 Q160 46 146 52 Q134 44 124 62 L112 52 L100 82 L88 52 L76 62 Q66 44 54 52 Q40 46 30 58 Q24 38 4 30 Q40 14 64 26 Q76 22 88 24 L92 6 Z"/>
  </defs>

  <rect width="1000" height="280" rx="14" fill="url(#bg)"/>

  <!-- smoke behind text -->
  <g filter="url(#smoke)">
    <circle cx="120" cy="300" r="50" fill="#8fa9b8" opacity="0">
      <animate attributeName="cy" values="310;-50" dur="9s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="120;170;110" dur="9s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="40;85" dur="9s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.35;.2;0" dur="9s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="300" r="50" fill="#7f98a8" opacity="0">
      <animate attributeName="cy" values="310;-50" dur="11s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="300;260;330" dur="11s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="45;90" dur="11s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.3;.18;0" dur="11s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="300" r="55" fill="#9fb8c4" opacity="0">
      <animate attributeName="cy" values="320;-60" dur="10s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="500;540;470" dur="10s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="50;95" dur="10s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.3;.15;0" dur="10s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="300" r="50" fill="#8fa9b8" opacity="0">
      <animate attributeName="cy" values="310;-50" dur="12s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="700;740;690" dur="12s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="45;90" dur="12s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.32;.18;0" dur="12s" begin="-7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="300" r="50" fill="#7f98a8" opacity="0">
      <animate attributeName="cy" values="310;-50" dur="9.5s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="880;840;900" dur="9.5s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="40;85" dur="9.5s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.35;.2;0" dur="9.5s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="300" r="45" fill="#9fb8c4" opacity="0">
      <animate attributeName="cy" values="310;-50" dur="13s" begin="-9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="400;430;380" dur="13s" begin="-9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="40;80" dur="13s" begin="-9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.28;.15;0" dur="13s" begin="-9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="300" r="45" fill="#8fa9b8" opacity="0">
      <animate attributeName="cy" values="310;-50" dur="10.5s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;570;630" dur="10.5s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="40;80" dur="10.5s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.28;.15;0" dur="10.5s" begin="-1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- bat emblems -->
  <g transform="translate(40,80) scale(0.9)" fill="#00e5ff" filter="url(#glow)">
    <use href="#bat"/>
    <animate attributeName="opacity" values="1;.55;1" dur="3.5s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(960,80) scale(-0.9,0.9)" fill="#00e5ff" filter="url(#glow)">
    <use href="#bat"/>
    <animate attributeName="opacity" values="1;.55;1" dur="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- name -->
  <text x="500" y="118" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="66" font-weight="700" letter-spacing="5" fill="url(#txt)" filter="url(#glow)" opacity="0">
    MAHIN MRIDHA
    <animate attributeName="opacity" values="0;1;.85;1;.92;1;1;0" keyTimes="0;.08;.12;.18;.25;.4;.92;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- aka GhostUkab -->
  <text x="500" y="178" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="40" font-weight="700" letter-spacing="4" fill="#ffffff" filter="url(#glow)" opacity="0">
    <tspan fill="#9fb8c4" font-weight="400">aka </tspan>GhostUkab
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.1;.22;.92;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- divider -->
  <line x1="200" y1="204" x2="800" y2="204" stroke="#00e5ff" stroke-width="2" stroke-dasharray="600" stroke-dashoffset="600" opacity=".7">
    <animate attributeName="stroke-dashoffset" values="600;600;0;0;600" keyTimes="0;.14;.36;.92;1" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- subtitle -->
  <text x="500" y="240" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="17" letter-spacing="4" fill="#9fb8c4" opacity="0">
    // FULL STACK DEVELOPER  ·  MERN + NEXT.JS
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.4;.92;1" dur="8s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
